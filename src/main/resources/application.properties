micronaut.application.name=dvxaisched
micronaut.server.port=${PORT:8080}
micronaut.server.host=0.0.0.0
micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.paths=classpath:public
micronaut.router.static-resources.default.mapping=/**

micronaut.http.client.read-timeout=120s
micronaut.http.client.connect-timeout=30s

gemini.model=gemini-3.5-flash-lite

# IP & Session Rate Limiting configuration
ratelimit.enabled=true
ratelimit.session-limit=5
ratelimit.session-window-seconds=60
ratelimit.ip-limit=60
ratelimit.ip-window-seconds=60

# In-memory query schedule cache (avoids repeated Gemini calls for common prompts)
cache.schedule.enabled=true
cache.schedule.ttl-minutes=120
cache.schedule.max-entries=500
