plugins {
    id "io.micronaut.application" version "5.0.2"
    id "com.gradleup.shadow" version "9.4.1"
    id "io.micronaut.aot" version "5.0.2"
}

version = "0.1"
group = "dvxaisched"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor "io.micronaut:micronaut-http-validation"
    annotationProcessor "io.micronaut.serde:micronaut-serde-processor"
    annotationProcessor "io.micronaut.langchain4j:micronaut-langchain4j-processor"
    implementation "io.micronaut.serde:micronaut-serde-jackson"
    implementation "io.micronaut.reactor:micronaut-reactor"
    implementation "io.micronaut.langchain4j:micronaut-langchain4j-core"
    // Official Google GenAI SDK module for LangChain4j
    implementation "dev.langchain4j:langchain4j-google-genai:1.20.0-beta30"
    implementation "dev.langchain4j:langchain4j-agentic:1.20.0-beta30"
    implementation "io.micronaut:micronaut-http-client"
    runtimeOnly "ch.qos.logback:logback-classic"
    testImplementation "io.micronaut:micronaut-http-client"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

application {
    mainClass = "dvxaisched.Application"
}

java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}

graalvmNative.toolchainDetection = false
graalvmNative {
    binaries {
        all {
            buildArgs.add("-H:+SharedArenaSupport")
        }
    }
}

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("dvxaisched.*")
    }
    aot {
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}

tasks.named("dockerfile") {
    baseImage = "eclipse-temurin:25-jre"
}

tasks.withType(AbstractTestTask).configureEach {
    failOnNoDiscoveredTests = false
}

tasks.withType(Test).configureEach {
    def apiKey = System.getenv("GEMINI_API_KEY") ?: ""
    environment "GEMINI_API_KEY", apiKey
}

tasks.register("fetchSchedule") {
    group = "conference"
    description = "Fetches the latest official Devoxx Belgium schedule from the CFP API and installs it into src/main/resources/devoxx-be-2026.json"

    doLast {
        def slug = project.findProperty("eventSlug") ?: "dvbe26"
        def baseUrl = "https://${slug}.cfp.dev/api/public"
        def slurper = new groovy.json.JsonSlurper()

        logger.lifecycle("Fetching talks catalog from ${baseUrl}/talks...")
        def allTalks = slurper.parse(new URI("${baseUrl}/talks").toURL())
        Map<Long, Map> talkMap = allTalks.collectEntries { [(it.id as Long): it] }
        logger.lifecycle("Fetched ${allTalks.size()} talks from catalog.")

        logger.lifecycle("Fetching schedules from ${baseUrl}/schedules...")
        def schedules = slurper.parse(new URI("${baseUrl}/schedules").toURL())
        def days = schedules.links.collect { it.href.tokenize("/").last() }
        logger.lifecycle("Found schedule days: ${days.join(', ')}")

        def timeFormatter = java.time.format.DateTimeFormatter.ofPattern("HH:mm")
        def scheduledTalks = []

        days.each { day ->
            logger.lifecycle("Fetching schedule for ${day}...")
            def slots = slurper.parse(new URI("${baseUrl}/schedules/${day}").toURL())
            int dayCount = 0
            slots.each { slot ->
                if (slot.proposal != null) {
                    long talkId = slot.proposal.id as Long
                    def talk = talkMap[talkId] ?: [:]

                    def tz = slot.timezone ?: "Europe/Brussels"
                    def zoneId = java.time.ZoneId.of(tz)
                    def startZdt = java.time.Instant.parse(slot.fromDate).atZone(zoneId)
                    def endZdt = java.time.Instant.parse(slot.toDate).atZone(zoneId)

                    def speakers = (talk.speakers ?: slot.speakers ?: []).collect { s ->
                        def speakerName = s.fullName ?: ("${s.firstName ?: ''} ${s.lastName ?: ''}".trim())
                        [
                            id: s.id as Long,
                            name: speakerName,
                            company: s.company ?: "",
                            bio: s.bio ?: ""
                        ]
                    }

                    def talkTitle = (talk.title ?: slot.proposal.title ?: "").trim()
                    def titleSlug = talkTitle.toLowerCase().replaceAll(/[^a-z0-9]+/, '-').replaceAll(/^-+|-+$/, '')
                    def talkUrl = "https://m.devoxx.com/events/${slug}/talks/${talkId}" + (titleSlug ? "/${titleSlug}" : "")

                    scheduledTalks << [
                        id: talkId,
                        day: day.toLowerCase(),
                        date: startZdt.toLocalDate().toString(),
                        startTime: startZdt.toLocalTime().format(timeFormatter),
                        endTime: endZdt.toLocalTime().format(timeFormatter),
                        room: slot.room?.name ?: "TBA",
                        title: talkTitle,
                        summary: talk.summary ?: slot.proposal.summary ?: "",
                        track: talk.track?.name ?: slot.track?.name ?: "",
                        sessionType: talk.sessionType?.name ?: slot.sessionType?.name ?: "",
                        totalFavourites: (talk.totalFavourites ?: slot.totalFavourites ?: 0) as int,
                        speakers: speakers,
                        description: talk.description ?: "",
                        url: talkUrl
                    ]
                    dayCount++
                }
            }
            logger.lifecycle("  -> ${day}: ${dayCount} talks scheduled")
        }

        scheduledTalks.sort { a, b ->
            a.date <=> b.date ?:
            a.startTime <=> b.startTime ?:
            a.room <=> b.room ?:
            a.id <=> b.id
        }

        def targetFile = layout.projectDirectory.file("src/main/resources/devoxx-be-2026.json").asFile
        targetFile.parentFile.mkdirs()
        targetFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(scheduledTalks)) + "\n"

        logger.lifecycle("Successfully installed ${scheduledTalks.size()} scheduled talks into ${targetFile.path}")
    }
}

